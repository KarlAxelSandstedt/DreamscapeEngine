# DreamscapeEngine config: one "key: value" per line, '#' starts a comment
# Determinism reference (record= hash=): serial. The replays (replay= hash=) use this file with
# another thread_count (script/*/determinism.*).

# Xoshiro256Init seed, 4 words; all 0: system entropy. Fixed: the scene's noise floor mesh is built
# from the thread RNG, and a record names the mesh only by prefab id
rng_seed: 1 2 3 4

# engine persistent arena, bytes
persistent_size: 268435456

# workers including the main thread; 0: logical cores - 2
thread_count: 1


# per-thread scratch arena, bytes
thread_scratchsize: 1048576

# per-thread scratch arenas
thread_scratch_count: 5

# 1: no graphics (SDL, windows, UI, GL)
headless: 0

# per dynamics worker: the pipeline's double-buffered frame arenas, bytes
dynamics_worker_framesize: 8388608

# the server's frame arena: the arrivals and the ticks' scratch memory, bytes
server_framesize: 33554432
